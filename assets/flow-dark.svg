<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"><rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#141E2C" stroke="#28364A" stroke-width="1"/><text x="32" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="start" letter-spacing="1">WHEN YOU HAVE A JOB</text><rect x="32" y="60" width="236" height="70" rx="12" fill="#1B2838" stroke="#28364A" stroke-width="1"/><text x="150.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E7EDF6" text-anchor="middle" letter-spacing="0">You type the job</text><text x="150.0" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="0">/skillselect build a landing page</text><line x1="268" x2="308" y1="95" y2="95" stroke="#66758A" stroke-width="2"/><path d="M306 89 L316 95 L306 101 Z" fill="#66758A"/><rect x="316" y="60" width="252" height="70" rx="12" fill="#5B9FEA"/><text x="442.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0C131E" text-anchor="middle" letter-spacing="0">1  Scores your skills</text><text x="442.0" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#0C131E" text-anchor="middle" letter-spacing="0">every installed skill, by fit</text><line x1="568" x2="608" y1="95" y2="95" stroke="#66758A" stroke-width="2"/><path d="M606 89 L616 95 L606 101 Z" fill="#66758A"/><rect x="616" y="60" width="252" height="70" rx="12" fill="#5B9FEA"/><text x="742.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0C131E" text-anchor="middle" letter-spacing="0">2  Adds GitHub skills</text><text x="742.0" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#0C131E" text-anchor="middle" letter-spacing="0">ranked by fit and stars together</text><line x1="868" x2="908" y1="95" y2="95" stroke="#66758A" stroke-width="2"/><path d="M906 89 L916 95 L906 101 Z" fill="#66758A"/><rect x="916" y="60" width="252" height="70" rx="12" fill="#3FD1A2"/><text x="1042.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0C131E" text-anchor="middle" letter-spacing="0">3  Keeps what does the job</text><text x="1042.0" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#0C131E" text-anchor="middle" letter-spacing="0">when and how for each</text><text x="32" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="start" letter-spacing="1">ON EVERY REQUEST</text><rect x="32" y="194" width="236" height="70" rx="12" fill="#1B2838" stroke="#28364A" stroke-width="1"/><text x="150.0" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E7EDF6" text-anchor="middle" letter-spacing="0">You ask</text><text x="150.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="0">as you always do</text><line x1="268" x2="308" y1="229" y2="229" stroke="#66758A" stroke-width="2"/><path d="M306 223 L316 229 L306 235 Z" fill="#66758A"/><rect x="316" y="194" width="400" height="70" rx="12" fill="#1B2838" stroke="#28364A" stroke-width="1"/><text x="516.0" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E7EDF6" text-anchor="middle" letter-spacing="0">One sentence is added for you</text><text x="516.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="0">short, finished, your own facts</text><line x1="716" x2="756" y1="229" y2="229" stroke="#66758A" stroke-width="2"/><path d="M754 223 L764 229 L754 235 Z" fill="#66758A"/><rect x="764" y="194" width="404" height="70" rx="12" fill="#1B2838" stroke="#28364A" stroke-width="1"/><text x="966.0" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E7EDF6" text-anchor="middle" letter-spacing="0">A short answer you can use as it is</text><text x="966.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="0">no blanks, nothing extra</text></svg>
