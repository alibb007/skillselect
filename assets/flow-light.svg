t on GitHub</text><text x="742.0" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">most stars first</text><line x1="868" x2="908" y1="95" y2="95" stroke="#9AA6B8" stroke-width="2"/><path d="M906 89 L916 95 L906 101 Z" fill="#9AA6B8"/><rect x="916" y="60" width="252" height="70" rx="12" fill="#178A63"/><text x="1042.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">3  How to use it</text><text x="1042.0" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">one pick, and its command</text><text x="32" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#5B6A80" text-anchor="start" letter-spacing="1">ON EVERY REQUEST</text><rect x="32" y="194" width="236" height="70" rx="12" fill="#E8EDF4" stroke="#D5DCE8" stroke-width="1"/><text x="150.0" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#101A2B" text-anchor="middle" letter-spacing="0">You ask</text><text x="150.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#5B6A80" text-anchor="middle" letter-spacing="0">as you always do</text><line x1="268" x2="308" y1="229" y2="229" stroke="#9AA6B8" stroke-width="2"/><path d="M306 223 L316 229 L306 235 Z" fill="#9AA6B8"/><rect x="316" y="194" width="400" height="70" rx="12" fill="#E8EDF4" stroke="#D5DCE8" stroke-width="1"/><text x="516.0" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill=