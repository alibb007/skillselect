<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"><rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#141E2C" stroke="#28364A" stroke-width="1"/><text x="32" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="start" letter-spacing="1">EVERY REQUEST</text><rect x="32" y="60" width="250" height="70" rx="12" fill="#1B2838" stroke="#28364A" stroke-width="1"/><text x="157.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E7EDF6" text-anchor="middle" letter-spacing="0">You ask</text><text x="157.0" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="0">as you always do</text><line x1="282" x2="322" y1="95" y2="95" stroke="#66758A" stroke-width="2"/><path d="M320 89 L330 95 L320 101 Z" fill="#66758A"/><rect x="330" y="60" width="380" height="70" rx="12" fill="#5B9FEA"/><text x="520.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0C131E" text-anchor="middle" letter-spacing="0">One sentence is added for you</text><text x="520.0" y="113" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#0C131E" text-anchor="middle" letter-spacing="0">short, finished, your own facts</text><line x1="710" x2="750" y1="95" y2="95" stroke="#66758A" stroke-width="2"/><path d="M748 89 L758 95 L748 101 Z" fill="#66758A"/><rect x="758" y="60" width="410" height="70" rx="12" fill="#1B2838" stroke="#28364A" stroke-width="1"/><text x="963.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E7EDF6" text-anchor="midd