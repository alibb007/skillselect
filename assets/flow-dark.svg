al,sans-serif" font-size="16" font-weight="700" fill="#0C131E" text-anchor="middle" letter-spacing="0">GitHub</text><text x="753.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#0C131E" text-anchor="middle" letter-spacing="0">most stars first</text><line x1="878" x2="918" y1="229" y2="229" stroke="#66758A" stroke-width="2"/><path d="M916 223 L926 229 L916 235 Z" fill="#66758A"/><rect x="926" y="194" width="242" height="70" rx="12" fill="#1B2838" stroke="#28364A" stroke-width="1"/><text x="1047.0" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#E7EDF6" text-anchor="middle" letter-spacing="0">A list to choose from</text><text x="1047.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="0">nothing installed</text></svg>
